name: CI

on:
  pull_request:
  push:
    branches: [main]
    tags-ignore:
      - '**'
  workflow_dispatch:

jobs:
  check:
    name: Check & Clippy
    # Skip on the template repo itself (placeholder crates don't build)
    if: github.repository != 'Iteratrix/rust-wasm-pages-template'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - run: cargo clippy --workspace --all-targets -- -D warnings

  test:
    name: Tests
    # Skip on the template repo itself (placeholder crates don't build)
    if: github.repository != 'Iteratrix/rust-wasm-pages-template'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo test --workspace

  fmt:
    name: Format
    # Skip on the template repo itself (placeholder crates don't build)
    if: github.repository != 'Iteratrix/rust-wasm-pages-template'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all -- --check

  wasm:
    name: WASM + Web Build
    # Skip on the template repo itself (placeholder crates don't build)
    if: github.repository != 'Iteratrix/rust-wasm-pages-template'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - run: cargo install wasm-pack
      - run: wasm-pack build {{project-name}}-web --target web --out-dir ../web/pkg
      - run: node web/build.mjs
