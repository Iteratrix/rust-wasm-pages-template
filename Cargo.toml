[workspace]
resolver = "2"
members = [
    "{{project-name}}-core",
    "{{project-name}}-web",
{%- if cli %}
    "{{project-name}}-cli",
{%- endif %}
]

[workspace.package]
version = "0.1.0"
edition = "2021"

[workspace.lints.rust]
unsafe_code = "deny"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
must_use_candidate = "allow"
# Prevent accidental debug/todo artifacts
dbg_macro = "deny"
todo = "deny"
unimplemented = "deny"
